name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -m 'not integration'
      - run: node --test tests/ui/logic.test.mjs

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://career:career_local_only@localhost:5432/career
      QDRANT_URL: http://localhost:6333
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Build, migrate and start the complete stack
        run: |
          docker compose version
          docker compose up --build --wait --wait-timeout 120
      - name: Check running container endpoints and schema
        run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ready
          docker compose run --rm --no-deps migrate alembic check
      - run: uv run --frozen pytest -m integration
      - name: Exercise operator CLI and job API with synthetic data
        run: |
          uv run --frozen python -m app.ingestion.cli import examples/jobs.synthetic.json
          uv run --frozen python -m app.ingestion.cli import examples/jobs.synthetic.json
          curl --fail 'http://localhost:8000/jobs?limit=1'
          curl --fail --json '{"query":"Python","mode":"bm25","top_k":3}' http://localhost:8000/search
          curl --fail --json '{"question":"How many jobs?"}' http://localhost:8000/ask > /tmp/ask.json
          python -c 'import json; d=json.load(open("/tmp/ask.json")); assert d["route"] == "analytics" and d["status"] == "ok" and d["analytics"]["rows"][0]["listing_count"] > 0, d'
          uv run --frozen python -m scripts.smoke_cv
      - name: PostgreSQL and Qdrant backup/restore drill on synthetic data
        run: APP_ENV=test M6_BACKUP_FIXTURE=1 uv run --frozen python -m scripts.smoke_backup
      - name: Production stack HTTPS/auth/CV/restart smoke on loopback only
        run: uv run --frozen python -m scripts.smoke_production
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI containers
        if: always()
        run: docker compose down
