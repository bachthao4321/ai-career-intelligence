name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -m 'not integration'

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://career:career_local_only@localhost:5432/career
      QDRANT_URL: http://localhost:6333
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Build, migrate and start the complete stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check running container endpoints and schema
        run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ready
          docker compose run --rm --no-deps migrate alembic check
      - run: uv run --frozen pytest -m integration
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI containers
        if: always()
        run: docker compose down
