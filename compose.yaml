name: ai-career-intelligence

x-app: &app
  image: ai-career-intelligence:local
  build: .
  environment: &app-env
    APP_NAME: ${APP_NAME:-AI Career Intelligence}
    APP_ENV: local
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:-career_local_only}@postgres:5432/${POSTGRES_DB:-career}
    QDRANT_URL: http://qdrant:6333
    DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
    DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
    EMBEDDING_MODEL_DIR: /models/multilingual-minilm
    EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
    QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-career_jobs}
    RRF_K: ${RRF_K:-60}
    RRF_BM25_WEIGHT: ${RRF_BM25_WEIGHT:-2}
    RRF_DENSE_WEIGHT: ${RRF_DENSE_WEIGHT:-1}
    ANALYTICS_DATABASE_URL: postgresql+psycopg://career_analytics_local:${ANALYTICS_ROLE_PASSWORD:-career_analytics_local_only_2026}@postgres:5432/${POSTGRES_DB:-career}
    ANALYTICS_TIMEOUT_MS: ${ANALYTICS_TIMEOUT_MS:-1500}
    MODEL_LAN_HTTP_HOSTS: '${MODEL_LAN_HTTP_HOSTS:-[]}'
    AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
    AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-http://localhost:11434/v1}
    AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-qwen3:8b}
    AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
    AGENT_DAILY_CALL_LIMIT: ${AGENT_DAILY_CALL_LIMIT:-0}
    CV_TTL_SECONDS: ${CV_TTL_SECONDS:-3600}
    CV_CAPACITY: ${CV_CAPACITY:-1000}
    CV_CLEANUP_INTERVAL_SECONDS: ${CV_CLEANUP_INTERVAL_SECONDS:-60}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:11434/v1}
    LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
    LLM_MODEL_REVISION: ${LLM_MODEL_REVISION:-unverified}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-0}
    LLM_GLOBAL_DAILY_CALL_LIMIT: ${LLM_GLOBAL_DAILY_CALL_LIMIT:-100}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
    LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}
    LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-0.5}
    LLM_CONCURRENCY: ${LLM_CONCURRENCY:-2}
    LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-3600}
    LLM_CACHE_CAPACITY: ${LLM_CACHE_CAPACITY:-1000}
    RERANK_ENABLED: ${RERANK_ENABLED:-false}
    RERANK_CANDIDATES: ${RERANK_CANDIDATES:-10}
    RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-5}
  volumes:
    - ./models:/models:ro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career}
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # Do not assume the official image contains curl/wget. /ready probes /readyz.

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    volumes:
      - ./models:/models:ro
      - ./app/web/static:/app/app/web/static:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      analytics-role:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s

  analytics-role:
    <<: *app
    command: ["python", "-m", "app.cli.ask", "provision", "--scope", "local", "--role", "career_analytics_local"]
    environment:
      <<: *app-env
      ANALYTICS_ROLE_PASSWORD: ${ANALYTICS_ROLE_PASSWORD:-career_analytics_local_only_2026}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  qdrant_data:
