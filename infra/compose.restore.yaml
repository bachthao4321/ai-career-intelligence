# Disposable restore-drill services. The operations tool generates the project/password.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: career_restore
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${RESTORE_PASSWORD:?Generated by operations CLI}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U career -d career_restore"]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes: ["qdrant_data:/qdrant/storage"]
  tool:
    image: ${RESTORE_TOOL_IMAGE:-ai-career-intelligence:local}
    profiles: [tools]
    environment:
      QDRANT_URL: http://qdrant:6333
volumes:
  postgres_data:
  qdrant_data:
